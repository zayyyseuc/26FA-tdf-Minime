<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zia's Mini-Me</title>
<style>
  :root { --bg:#faf8f5; --fg:#222; --muted:#7a746c; --card:#fff; --line:#e7e2da; --accent:#3d5a4c; --user:#eee9e0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161513; --fg:#ece8e1; --muted:#9a948a; --card:#1f1d1a; --line:#33302b; --accent:#8fb5a0; --user:#2a2723; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif; }
  main { max-width:680px; margin:0 auto; padding:24px 16px 120px; min-height:100vh; display:flex; flex-direction:column; }
  header { margin-bottom:20px; }
  h1 { font-size:20px; margin:0 0 4px; font-weight:600; }
  .label { display:inline-block; font-size:12px; color:var(--accent); border:1px solid var(--accent); border-radius:99px; padding:1px 10px; }
  #log { flex:1; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--card); border:1px solid var(--line); align-self:flex-start; }
  .you { background:var(--user); align-self:flex-end; }
  .src { font-size:12px; color:var(--muted); margin-top:6px; }
  #starters { display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  #starters button { text-align:left; background:none; border:1px dashed var(--line); color:var(--fg); border-radius:12px; padding:10px 14px; font:inherit; cursor:pointer; }
  #starters button:hover { border-color:var(--accent); }
  form { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .row { max-width:680px; margin:0 auto; display:flex; gap:8px; }
  input[type=text], textarea { flex:1; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); }
  button.send { font:inherit; border:0; background:var(--accent); color:#fff; border-radius:10px; padding:0 18px; cursor:pointer; }
  button.send:disabled { opacity:.5; }
  .note { max-width:680px; margin:8px auto 0; font-size:13px; }
  .note button { background:none; border:0; color:var(--muted); text-decoration:underline; cursor:pointer; font:inherit; padding:0; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--fg); max-width:420px; width:calc(100% - 32px); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog p { margin:0 0 12px; font-size:14px; color:var(--muted); }
  dialog input, dialog textarea { width:100%; margin-bottom:10px; }
  dialog .btns { display:flex; gap:8px; justify-content:flex-end; }
  dialog .btns button:first-child { background:none; border:0; color:var(--muted); cursor:pointer; font:inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Zia's Mini-Me</h1>
    <span class="label" id="label">AI</span>
  </header>
  <div id="log"></div>
  <div id="starters"></div>
</main>

<form id="form">
  <div class="row">
    <input type="text" id="input" placeholder="Ask anything, or tell me what you're working on" autocomplete="off" maxlength="1500">
    <button class="send" id="send">Send</button>
  </div>
  <div class="note"><button type="button" id="leave">Leave a note for Zia</button></div>
</form>

<dialog id="dlg">
  <p>This sends our conversation to Zia, along with how to reach you. She will read it herself.</p>
  <input type="text" id="contact" placeholder="Email or other contact" maxlength="200">
  <textarea id="extra" rows="3" placeholder="Anything you'd like to add (optional)" maxlength="1000"></textarea>
  <div class="btns"><button type="button" id="cancel">Cancel</button><button type="button" class="send" id="go" style="padding:8px 16px">Send to Zia</button></div>
  <p id="status" style="margin:10px 0 0"></p>
</dialog>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const startersEl = document.getElementById('starters');
const messages = []; // only real turns; the greeting is display-only

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function render(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function add(cls, text){
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.innerHTML = render(text);
  log.appendChild(d); window.scrollTo(0, document.body.scrollHeight);
  return d;
}

async function ask(text){
  text = text.trim(); if (!text) return;
  startersEl.innerHTML = '';
  input.value = ''; sendBtn.disabled = true;
  add('you', text); messages.push({ role:'user', content:text });
  const bot = add('bot', '…'); let acc = '', sources = [];
  try {
    const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ messages }) });
    if (!res.ok) { const j = await res.json().catch(()=>({})); throw new Error(j.error || 'Request failed'); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith('data: ')) continue;
        const ev = JSON.parse(p.slice(6));
        if (ev.type === 'sources') sources = ev.sources;
        else if (ev.type === 'delta') { acc += ev.text; bot.innerHTML = render(acc); window.scrollTo(0, document.body.scrollHeight); }
        else if (ev.type === 'error') throw new Error(ev.message);
      }
    }
    messages.push({ role:'assistant', content:acc });
    if (sources.length) { const s = document.createElement('div'); s.className='src'; s.textContent = 'From: ' + sources.map(x => x.replace(/\.(md|txt)$/i,'')).join(' · '); bot.appendChild(s); }
  } catch (e) {
    bot.textContent = e.message; messages.pop();
  }
  sendBtn.disabled = false; input.focus();
}

document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); ask(input.value); });

fetch('/api/config').then(r => r.json()).then(c => {
  document.getElementById('title').textContent = c.title;
  document.getElementById('label').textContent = c.aiLabel;
  document.title = c.title;
  add('bot', c.greeting);
  (c.starters || []).forEach(s => { const b = document.createElement('button'); b.textContent = s; b.onclick = () => ask(s); startersEl.appendChild(b); });
}).catch(() => add('bot', 'Hi, I\'m Zia\'s Mini-Me (an AI). Ask me anything.'));

// Handoff dialog (visitor-triggered)
const dlg = document.getElementById('dlg'), status = document.getElementById('status');
document.getElementById('leave').onclick = () => { status.textContent = ''; dlg.showModal(); };
document.getElementById('cancel').onclick = () => dlg.close();
document.getElementById('go').onclick = async () => {
  status.textContent = 'Sending…';
  try {
    const res = await fetch('/api/handoff', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ messages: messages.length ? messages : [{role:'user', content:'(no conversation yet)'}], contact: document.getElementById('contact').value, note: document.getElementById('extra').value }) });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || 'Failed');
    status.textContent = 'Sent. Thank you.'; setTimeout(() => dlg.close(), 1200);
  } catch (e) { status.textContent = e.message; }
};
</script>
</body>
</html>
